[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "db-fahrplan-mcp"
dynamic = ["version"]
description = "MCP server for live Deutsche Bahn timetables: journeys, fares, boards, delays, platforms, coach sequence, disruptions. Talks to bahn.de directly, no API key. Unofficial."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Kafkas M. Caprazli" }]
keywords = ["mcp", "model-context-protocol", "deutsche-bahn", "bahn", "fahrplan", "timetable", "railway", "train", "claude", "llm-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.10,<3",
  "httpx>=0.25,<1",
  "pydantic>=2",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/capraCoder/db-fahrplan-mcp"
Repository = "https://github.com/capraCoder/db-fahrplan-mcp"
Issues = "https://github.com/capraCoder/db-fahrplan-mcp/issues"
Changelog = "https://github.com/capraCoder/db-fahrplan-mcp/blob/main/CHANGELOG.md"

[project.scripts]
db-fahrplan-mcp = "db_fahrplan_mcp:main"

[tool.hatch.version]
path = "src/db_fahrplan_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/tests", "/.gitattributes"]

[tool.hatch.build.targets.wheel]
packages = ["src/db_fahrplan_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits bahn.de (deselected by default; run with -m live)"]
addopts = "-m 'not live'"
